<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PVF 34 浏览器</title>
<style>
  :root{
    --bg:#14161a; --bg2:#1b1e24; --bg3:#22262e; --fg:#dfe3ea; --dim:#8b93a1;
    --line:#2e333d; --acc:#5aa9ff; --warn:#ffb454; --ok:#63d18a;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
       font:13px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--acc)}
  #stats{color:var(--dim);font-size:12px;font-family:var(--mono)}
  #search{display:flex;gap:6px;margin-left:auto}
  #search input[type=text]{width:280px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);
       border-radius:6px;padding:5px 9px;font-family:var(--mono);font-size:12px}
  #search input:focus{outline:none;border-color:var(--acc)}
  select,button{background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;
       padding:5px 9px;font-size:12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--acc)}
  main{flex:1;display:flex;min-height:0}
  #side{width:46%;min-width:320px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  #crumb{padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-family:var(--mono);
         font-size:12px;color:var(--dim);white-space:nowrap;overflow:auto}
  #crumb a{color:var(--acc);text-decoration:none;cursor:pointer}
  #crumb a:hover{text-decoration:underline}
  #list{flex:1;overflow:auto}
  .row{display:flex;gap:8px;padding:3px 12px;cursor:pointer;font-family:var(--mono);font-size:12px;white-space:nowrap}
  .row:hover{background:var(--bg3)}
  .row.sel{background:#243040}
  .row .ico{width:14px;color:var(--warn);flex:none}
  .row .ico.file{color:var(--dim)}
  .row .nm{overflow:hidden;text-overflow:ellipsis}
  .row .sz{margin-left:auto;color:var(--dim);flex:none;padding-left:10px}
  #pane{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);
       font-family:var(--mono);font-size:12px;color:var(--dim)}
  #bar .p{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #bar .tag{padding:1px 6px;border:1px solid var(--line);border-radius:4px;flex:none}
  #body{flex:1;overflow:auto;margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.5px;
        white-space:pre;tab-size:2;color:#cfd6e3}
  #body .k{color:var(--acc)}
  #body .s{color:var(--ok)}
  #body .n{color:var(--warn)}
  .empty{color:var(--dim);padding:16px;font-family:var(--mono);font-size:12px}
  #hint{color:var(--dim);font-size:11px;padding:4px 12px;background:var(--bg2);border-top:1px solid var(--line)}
  a.dl{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>PVF <span>34.3.13.22</span> 浏览器</h1>
  <div id="stats">加载中…</div>
  <div id="search">
    <select id="mode">
      <option value="path">路径</option>
      <option value="text">内容</option>
    </select>
    <input id="q" type="text" placeholder="搜索… 例：crouchex / isSkillCooltime">
    <button id="go">搜索</button>
  </div>
</header>
<main>
  <div id="side">
    <div id="crumb"></div>
    <div id="list"></div>
  </div>
  <div id="pane">
    <div id="bar">
      <span class="p" id="fpath">← 左边选一个文件</span>
      <span class="tag" id="ftype"></span>
      <span class="tag" id="fsize"></span>
      <button id="raw" title="切换原始字节 / 解码文本">原始</button>
      <button id="copy" title="复制路径">复制路径</button>
    </div>
    <pre id="body"></pre>
    <div id="hint">双击目录进入 · 单击文件查看 · dtype1 自动解码成标签文本（需服务端带 --decode）</div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let cwd = "", curPath = "", curRaw = false, curData = null;

const fmt = n => n >= 1<<30 ? (n/(1<<30)).toFixed(2)+" GB"
             : n >= 1<<20 ? (n/(1<<20)).toFixed(1)+" MB"
             : n >= 1<<10 ? (n/(1<<10)).toFixed(1)+" KB" : n+" B";

async function api(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

async function loadStats(){
  try{
    const s = await api("/api/stats");
    $("#stats").textContent = `${s.files.toLocaleString()} 条目 · ${fmt(s.bytes)} · ${s.dirs.toLocaleString()} 目录`;
  }catch(e){ $("#stats").textContent = "统计失败"; }
}

function crumb(p){
  const parts = p ? p.split("/") : [];
  let acc = "", html = `<a data-p="">根</a>`;
  for(const x of parts){ acc = acc ? acc+"/"+x : x; html += ` / <a data-p="${acc}">${x}</a>`; }
  $("#crumb").innerHTML = html;
  $("#crumb").querySelectorAll("a").forEach(a=>a.onclick=()=>loadTree(a.dataset.p));
}

async function loadTree(p){
  cwd = p;
  crumb(p);
  const d = await api("/api/tree?parent="+encodeURIComponent(p));
  const list = $("#list");
  list.innerHTML = "";
  if(p){
    const up = document.createElement("div");
    up.className = "row"; up.innerHTML = `<span class="ico">↑</span><span class="nm">..</span>`;
    up.onclick = ()=>loadTree(p.split("/").slice(0,-1).join("/"));
    list.appendChild(up);
  }
  if(!d.items.length){
    list.insertAdjacentHTML("beforeend", `<div class="empty">（空目录）</div>`);
  }
  for(const it of d.items){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="ico ${it.dir?"":"file"}">${it.dir?"▸":"·"}</span>
                     <span class="nm">${it.name}</span>
                     <span class="sz">${it.dir?"":fmt(it.size)}</span>`;
    const full = p ? p+"/"+it.name : it.name;
    row.onclick = () => {
      document.querySelectorAll(".row.sel").forEach(e=>e.classList.remove("sel"));
      row.classList.add("sel");
      if(it.dir) loadTree(full); else openFile(full, false);
    };
    list.appendChild(row);
  }
}

function paint(){
  if(!curData) return;
  const d = curData, body = $("#body");
  $("#fpath").textContent = d.path;
  $("#ftype").textContent = "dtype "+d.dtype+" · "+d.mode;
  $("#fsize").textContent = fmt(d.size);
  if(d.mode === "binary" || d.mode === "raw"){
    body.textContent = hexdump(d.hex);
  }else if(d.text != null){
    body.textContent = d.text;
  }else{
    body.textContent = (d.hex||"");
  }
}

function hexdump(hex){
  const bs = [];
  for(let i=0;i<hex.length;i+=2) bs.push(hex.slice(i,i+2));
  const lines = [];
  for(let off=0; off<bs.length; off+=16){
    const chunk = bs.slice(off, off+16);
    const h = chunk.join(" ").padEnd(16*3-1," ");
    const a = chunk.map(b=>{const v=parseInt(b,16);return v>=32&&v<127?String.fromCharCode(v):".";}).join("");
    lines.push(off.toString(16).padStart(8,"0")+"  "+h+"  |"+a+"|");
  }
  return lines.join("\n");
}

async function openFile(path, raw){
  curPath = path; curRaw = raw;
  try{
    const d = await api("/api/file?path="+encodeURIComponent(path)+(raw?"&raw=1":""));
    curData = d;
    if(d.error){ $("#body").textContent = d.error; return; }
    paint();
  }catch(e){
    $("#body").textContent = "读取失败: "+e.message;
  }
}

$("#raw").onclick = ()=>{ if(curPath) openFile(curPath, !curRaw); };
$("#copy").onclick = async ()=>{
  if(!curPath) return;
  try{ await navigator.clipboard.writeText(curPath); $("#copy").textContent="已复制"; }
  catch(e){ $("#copy").textContent="复制失败"; }
  setTimeout(()=>$("#copy").textContent="复制路径", 1200);
};

async function search(){
  const q = $("#q").value.trim();
  if(!q) return;
  const mode = $("#mode").value;
  const list = $("#list");
  list.innerHTML = `<div class="empty">搜索中…</div>`;
  try{
    const d = await api(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}&limit=500`);
    list.innerHTML = "";
    if(!d.items.length){ list.innerHTML = `<div class="empty">没有命中</div>`; return; }
    for(const p of d.items){
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="ico file">🔍</span><span class="nm">${p}</span>`;
      row.onclick = () => openFile(p, false);
      list.appendChild(row);
    }
    if(d.truncated) list.insertAdjacentHTML("beforeend", `<div class="empty">（结果已截断，最多 500 条）</div>`);
    $("#crumb").innerHTML = `<span>搜索 “${q}” — ${d.items.length} 条</span>`;
  }catch(e){ list.innerHTML = `<div class="empty">搜索失败: ${e.message}</div>`; }
}

$("#go").onclick = search;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
$("#mode").onchange = ()=>$("#q").focus();

loadStats(); loadTree("");
</script>
</body>
</html>
